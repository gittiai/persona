<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ owner }} — AI Persona</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #fafbfd; color: #1a202c; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #e3e6ec; background: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  header .name { font-weight: 700; font-size: 16px; }
  header .meta { font-size: 12px; color: #6b7280; }
  .booking {
    background: #2a4365; color: #fff; padding: 8px 14px;
    border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600;
  }
  main {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 760px;
    margin: 0 auto; width: 100%;
  }
  .turn { margin-bottom: 16px; display: flex; }
  .turn .bubble {
    padding: 10px 14px; border-radius: 12px; max-width: 75%;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap;
  }
  .turn.user { justify-content: flex-end; }
  .turn.user .bubble { background: #2a4365; color: #fff; border-bottom-right-radius: 4px; }
  .turn.bot .bubble { background: #fff; border: 1px solid #e3e6ec; border-bottom-left-radius: 4px; }
  .turn.bot.thinking .bubble { color: #9ca3af; font-style: italic; }
  footer {
    padding: 14px 20px; border-top: 1px solid #e3e6ec; background: #fff;
  }
  .input {
    max-width: 760px; margin: 0 auto; display: flex; gap: 10px;
  }
  .input input {
    flex: 1; padding: 10px 14px; font-size: 14px; font-family: inherit;
    border: 1px solid #e3e6ec; border-radius: 8px; outline: none;
  }
  .input input:focus { border-color: #2a4365; }
  .input button {
    background: #2a4365; color: #fff; border: none; padding: 0 18px;
    border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  .input button:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty { color: #6b7280; text-align: center; padding: 40px 20px; font-size: 14px; }
  .empty h2 { font-size: 18px; color: #1a202c; margin-bottom: 8px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .suggestions button {
    background: #fff; border: 1px solid #e3e6ec; padding: 6px 12px;
    border-radius: 16px; font-size: 12px; cursor: pointer; font-family: inherit;
    color: #4a5568;
  }
  .suggestions button:hover { border-color: #2a4365; color: #2a4365; }
</style>
</head>
<body>
<header>
  <div>
    <div class="name">{{ owner }} — AI Persona</div>
    <div class="meta">Grounded in resume + {{ repo_count }} GitHub repos ({{ corpus_chars }} chars)</div>
  </div>
  {% if booking_url %}
  <a class="booking" href="{{ booking_url }}" target="_blank">Book a call</a>
  {% endif %}
</header>

<main id="log">
  <div class="empty" id="empty">
    <h2>Ask me anything about {{ owner }}</h2>
    <p>Background, skills, projects, fit for a role — or book a call.</p>
    <div class="suggestions">
      <button onclick="send('Why are you the right person for an AI Engineer role?')">Why are you right for this role?</button>
      <button onclick="send('Tell me about your most interesting GitHub project.')">Most interesting project</button>
      <button onclick="send('What is your experience with RAG and voice agents?')">RAG / voice experience</button>
      <button onclick="send('I want to book a call.')">Book a call</button>
    </div>
  </div>
</main>

<footer>
  <form class="input" onsubmit="event.preventDefault(); sendInput();">
    <input id="msg" type="text" placeholder="Ask a question…" autocomplete="off" />
    <button id="btn" type="submit">Send</button>
  </form>
</footer>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const input = document.getElementById('msg');
const btn = document.getElementById('btn');
const history = [];

function bubble(role, text) {
  const div = document.createElement('div');
  div.className = 'turn ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  div.appendChild(b);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function send(text) {
  if (!text || !text.trim()) return;
  if (empty) empty.remove();
  bubble('user', text);
  history.push({ role: 'user', content: text });
  const thinking = bubble('bot thinking', '…');
  btn.disabled = true;
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
    });
    const data = await r.json();
    thinking.remove();
    const reply = data.reply || data.error || 'Something went wrong.';
    bubble('bot', reply);
    history.push({ role: 'assistant', content: reply });
  } catch (e) {
    thinking.remove();
    bubble('bot', 'Network error: ' + e.message);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

function sendInput() {
  const t = input.value;
  input.value = '';
  send(t);
}
</script>
</body>
</html>
